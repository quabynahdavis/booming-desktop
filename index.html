<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booming Desktop</title>
    <script type="module" src="/node_modules/@material/web/all.js"></script>
  </head>
  <body>
    <div id="layout">
      <nav id="nav-drawer">
        <md-navigation-drawer pivot="start">
          <md-list>
            <md-list-item data-route="songs" selected>
              <div slot="headline">Songs</div>
            </md-list-item>
            <md-list-item data-route="albums">
              <div slot="headline">Albums</div>
            </md-list-item>
            <md-list-item data-route="artists">
              <div slot="headline">Artists</div>
            </md-list-item>
            <md-list-item data-route="playlists">
              <div slot="headline">Playlists</div>
            </md-list-item>
            <md-list-item data-route="folders">
              <div slot="headline">Folders</div>
            </md-list-item>

            <md-divider style="margin: 8px 0;"></md-divider>

            <md-list-item data-route="recently-played">
              <div slot="headline">Recently Played</div>
            </md-list-item>
            <md-list-item data-route="most-played">
              <div slot="headline">Most Played</div>
            </md-list-item>

            <md-divider style="margin: 8px 0;"></md-divider>

            <md-list-item data-route="settings">
              <div slot="headline">Settings</div>
            </md-list-item>
          </md-list>
        </md-navigation-drawer>
      </nav>

      <main id="app"></main>
    </div>

    <div id="player-panel" class="player-panel">
      <div class="player-handle"></div>
      <div class="player-collapsed">
        <img id="player-cover" alt="cover" />
        <div class="player-meta">
          <div id="player-title">No track</div>
          <div id="player-artist"></div>
        </div>
        <div class="player-controls">
          <button id="player-prev">⏮</button>
          <button id="player-play">▶</button>
          <button id="player-next">⏭</button>
        </div>
      </div>
      <div class="player-expanded">
        <div id="player-queue-list"></div>
        <md-slider id="player-progress" min="0" max="100" value="0"></md-slider>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
