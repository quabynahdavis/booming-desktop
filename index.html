<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booming Desktop</title>
  </head>
  <body>
    <main id="app">
      <md-top-app-bar>
        <div slot="title">Booming</div>
        <md-icon-button id="add-folder" slot="trailing-actions" title="Add folder">
          <md-icon>folder_plus</md-icon>
        </md-icon-button>
      </md-top-app-bar>
      <div style="padding:16px">
        <md-text-field label="Search" style="width:100%"></md-text-field>
        <md-list id="song-list" style="margin-top:16px"></md-list>
        <div id="empty-state" style="text-align:center;margin-top:64px">
          <p>No songs yet</p>
          <md-filled-tonal-button id="add-folder-empty">Add music folder</md-filled-tonal-button>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
