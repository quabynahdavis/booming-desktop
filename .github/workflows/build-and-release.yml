name: Build Desktop

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
      - name: Install dependencies
        run: bun install
      - name: Type check
        run: bun run typecheck
      - name: Build frontend
        run: bun run build
      - name: Cargo check (default features)
        run: cargo check
      - name: Cargo check (no default features)
        run: cargo check --no-default-features
      - name: Run tests
        run: cargo test --lib

  build-linux:
    name: Build Linux
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.4.4'
      - name: Install Rust toolchain
        run: rustup default stable
      - name: Install mpv (for build verification)
        run: sudo apt-get install -y mpv libmpv-dev
      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install dependencies
        run: bun install
      - name: Build frontend
        run: bun run build
      - name: Build Tauri (deb + appimage)
        run: cargo tauri build
        env:
          CARGO_TAURI_BUILD_UPGRADE_KEY: ${{ secrets.TAURI_SIGNING_KEY || '' }}
      - name: Upload Linux artefacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: src-tauri/target/release/bundle/**/*.{deb,AppImage,deb}

  build-windows:
    name: Build Windows
    needs: lint-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.4.4'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install mpv
        run: choco install mpv -y --no-progress
      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\bun
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\cargo
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install dependencies
        run: bun install
      - name: Build frontend
        run: bun run build
      - name: Build Tauri (msi)
        run: cargo tauri build --target x86_64-pc-windows-msvc
      - name: Upload Windows artefacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: src-tauri/target/release/bundle/**/*.msi

  build-macos:
    name: Build macOS
    needs: lint-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.4.4'
      - name: Install Rust via rustup
        uses: actions-rs/toolchain@v1
        with:
          profile: stable
          toolchain: stable
      - name: Install mpv
        run: brew install mpv
      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/bun
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/cargo
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install dependencies
        run: bun install
      - name: Build frontend
        run: bun run build
      - name: Build Tauri (dmg)
        run: cargo tauri build --target x86_64-apple-darwin
      - name: Upload macOS artefacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: src-tauri/target/release/bundle/**/*.dmg

  release:
    name: Create Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: artefacts
      - name: Generate release notes from changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "## Release Notes for v$VERSION" > release-notes.md
          grep -A 20 "## \[\[$VERSION\]\]" docs/en/CHANGELOG.md >> release-notes.md || echo "No changelog entry for this version" >> release-notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artefacts/**/*
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'rc') }}