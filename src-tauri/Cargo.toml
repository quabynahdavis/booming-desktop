[package]
name = "booming-desktop"
version = "0.1.0"
description = "Booming Desktop — offline music player"
edition = "2021"
rust-version = "1.96"
readme = "../README.md"

[lib]
name = "booming_desktop_lib"
# `staticlib`/`cdylib` keep the crate shippable as a library host on mobile
# targets later; `rlib` is what the desktop binary links against.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[features]
# mpv backend: discovers libmpv via dlopen at runtime (BOOMING_MPV_LIBRARY
# env override + well-known sonames). Disabling the feature compiles the
# facade with only the null engine -- no dlopen code at all.
mpv = ["dep:libloading"]
default = ["mpv"]

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
# Runtime dynamic-loading support for the mpv backend. Optional on PURPOSE:
# nothing in this project may link against libmpv at build time.
libloading = { version = "0.9", optional = true }
